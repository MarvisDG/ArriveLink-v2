name: arrivelink

services:
  # ── Postgres 17 ────────────────────────────────────────────────────────────
  # Same major version as Neon so migrations behave identically on both.
  postgres:
    image: postgres:17-alpine
    container_name: arrivelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arrivelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arrivelink}
      POSTGRES_DB: ${POSTGRES_DB:-arrivelink}
      # Deterministic collation so ORDER BY matches Neon.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      # 5433 on the host, not 5432, on purpose. A native Postgres (Postgres.app
      # or brew) binds 127.0.0.1:5432 specifically, which beats Docker's
      # wildcard bind — so `localhost:5432` silently reaches the host instance
      # instead of this container, and you migrate one database while the API
      # reads another. Publishing on 5433 makes the two unambiguous.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Bind the check to the real user/db, otherwise it passes during initdb.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arrivelink} -d ${POSTGRES_DB:-arrivelink}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Express API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: arrivelink-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      # Service name, not localhost — localhost inside the container is the container.
      DATABASE_URL: postgres://${POSTGRES_USER:-arrivelink}:${POSTGRES_PASSWORD:-arrivelink}@postgres:5432/${POSTGRES_DB:-arrivelink}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend/src:/app/src
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Next.js ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: arrivelink-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Browser-side calls resolve from the host, so this is localhost, not `backend`.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      # Server-side (RSC/route handlers) calls stay on the compose network.
      INTERNAL_API_URL: http://backend:5000/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
